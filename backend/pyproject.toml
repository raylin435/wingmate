[project]
name = "wingmate-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ray Lin", email = "351656496+raylin435@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "amplitude-analytics>=1.3.0",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "numpy>=2.5.5",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
    "sie-sdk>=0.11.1",
    "singlestoredb>=1.20.0",
    "statsig-python-core>=0.24.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
wingmate-backend = "wingmate_backend:main"

[project.optional-dependencies]
memory = [
    "cognee>=1.6.10",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
